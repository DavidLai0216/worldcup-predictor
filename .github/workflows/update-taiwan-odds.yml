name: Update Taiwan odds

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-taiwan-odds.js
      - name: Commit updated odds
        run: |
          if git diff --quiet -- public/data/taiwan-odds.json; then
            echo "No odds changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/taiwan-odds.json
          git commit -m "Update Taiwan odds"
          git push

<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>世界盃賽事與賠率看板</title>
  <link rel="stylesheet" href="styles.css?v=20260618-trim-copy" />
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">台灣時間｜比分｜盤口</p>
      <h1>世界盃賽事與賠率看板</h1>
      <p class="subhead">今日比分、明日賽程、台灣運彩盤口與賽前比分機率集中整理。</p>
    </div>
  </header>

  <main>
    <section class="toolbar" aria-label="賽程階段">
      <div id="tabs" class="tabs"></div>
      <div class="jump-panel" aria-label="快速跳轉">
        <div class="jump-panel__search">
          <label for="jumpSearch">搜尋</label>
          <input id="jumpSearch" type="search" placeholder="輸入國家、組別、城市或場次" autocomplete="off" />
        </div>
        <div class="jump-panel__selects">
          <label>
            <span>國家</span>
            <select id="teamJump"></select>
          </label>
        </div>
        <div id="jumpResults" class="jump-results"></div>
      </div>
      <p id="sourceNote" class="source-note"></p>
    </section>

    <section id="content" aria-live="polite"></section>
  </main>

  <footer>
    <p>賽前比分與勝平負機率為模型推估，請以最新賽事資訊與官方盤口為準。</p>
  </footer>

  <script src="app.js?v=20260618-trim-copy"></script>
</body>
</html>

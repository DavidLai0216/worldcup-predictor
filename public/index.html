<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>世界盃成績預測看板</title>
  <link rel="stylesheet" href="styles.css?v=20260618-schedule-visible-time" />
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">世界盃賽程與比分模型</p>
      <h1>世界盃成績預測看板</h1>
      <p class="subhead">完整列出目前世界盃小組賽賽程、積分、已完賽比分摘要與未賽場次比分預測。</p>
    </div>
  </header>

  <main>
    <section class="toolbar" aria-label="賽程階段">
      <div id="tabs" class="tabs"></div>
      <div class="jump-panel" aria-label="快速跳轉">
        <div class="jump-panel__search">
          <label for="jumpSearch">搜尋</label>
          <input id="jumpSearch" type="search" placeholder="輸入國家、組別、城市或場次" autocomplete="off" />
        </div>
        <div class="jump-panel__selects">
          <label>
            <span>國家</span>
            <select id="teamJump"></select>
          </label>
        </div>
        <div id="jumpResults" class="jump-results"></div>
      </div>
      <p id="sourceNote" class="source-note"></p>
    </section>

    <section id="content" aria-live="polite"></section>
  </main>

  <footer>
    <p>限制：未賽場次的精確比分只是模型輔助推估，不代表保證結果；完賽摘要若標示「時間待補」代表目前公開來源尚未穩定提供精確進球分鐘。</p>
  </footer>

  <script src="app.js?v=20260618-schedule-visible-time"></script>
</body>
</html>

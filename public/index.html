<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>世界盃第一輪預測看板</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">World Cup Predictor</p>
      <h1>第一輪固定賽程預測看板</h1>
      <p class="subhead">每場先用 seed market 產生比分分佈；載入後嘗試抓 Polymarket 三路盤，解析完整才覆蓋。</p>
    </div>
    <div id="health" class="status status-waiting">後端檢查中...</div>
  </header>

  <main>
    <section class="toolbar">
      <div>
        <p class="label">市場來源</p>
        <strong id="marketSummary">Polymarket 0 · Kalshi 0 · Seed market 0</strong>
      </div>
      <button id="refreshMarkets" class="primary">重新抓盤口</button>
    </section>

    <section id="fixtures" class="fixtures" aria-live="polite"></section>
  </main>

  <footer>
    <p>限制：精確比分本質難測，最可能比分通常只有低十位數百分比。市場盤口只在能保守解析為主勝 / 和局 / 客勝時套用。</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
